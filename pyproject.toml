[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "houdini-ai-lab"
version = "0.1.0"
description = "Automation for a Houdini computational-natural-history laboratory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
houdini-ai = "houdini_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
